    <script>
      (function() {
        function suppress(e) {
          if (!e) return false;
          var msg = typeof e === 'string' ? e : (e.message || '');
          if (
            msg === 'Script error.' ||
            msg.indexOf('Script error') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            !e.filename
          ) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
          return false;
        }
        window.addEventListener('error', suppress, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
        window.onerror = function(msg, url, line, col, err) {
          if (typeof msg === 'string' && (msg.indexOf('Script error') !== -1 || !url || url.indexOf('youtube') !== -1 || url.indexOf('vidrift') !== -1)) {
            return true;
          }
          return false;
        };
      })();
    </script>
